<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" href="https://lightbox.fcasfs-of.cloud-fs.net/favicon.png"/>
  
  <title>Página Não Encontrada - TECH LightBox</title>
    <style>:root{--primary-color:#0066cc;--primary-hover:#0052a3;--text-color:#1d1d1f;--bg-color:#f5f5f7}* {box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-user-drag:none}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg-color);color:var(--text-color);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.container{text-align:center;max-width:600px;width:100%}.icon-wrapper{margin-bottom:24px}.icon-wrapper svg{width:80px;height:80px;fill:none;stroke:var(--primary-color);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}h1{font-size:clamp(4rem,10vw,6rem);font-weight:700;line-height:1;color:var(--primary-color);margin-bottom:16px}h2{font-size:clamp(1.2rem,4vw,1.5rem);font-weight:600;margin-bottom:12px}p{font-size:clamp(0.9rem,3vw,1rem);color:#6e6e73;margin-bottom:32px;line-height:1.5;padding:0 10px}.btn{display:inline-block;background-color:var(--primary-color);color:#ffffff;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:500;font-size:1rem;transition:background-color .2s ease,transform .1s ease;width:auto}@media(max-width:480px){.btn{width:100%;padding:16px}}

.dark {  --bg-color: #1c1c1e;  --text-color: #f5f5f7;  --primary-color: #2f95dc;}.dark p {  color: #8e8e93;}

</style>


</head>
<body oncontextmenu="return false;" ondrop="return false;" ondragstart="return false;">

    <div class="container">
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>
        <h1>404</h1>
        <h2>Página não encontrada</h2>
        <p>O conteúdo que você está procurando no TECH LightBox não existe ou foi movido para outro endereço.</p>
        <a href="/" class="btn">Voltar para a página inicial</a>
  <br/><br/><br/>  </div>
  <br/><br/><br/>
 

<script>
let currentTheme = localStorage.getItem("LightBox_theme") || "light";

  document.body.classList.remove('dark');
    const isDark = document.body.classList.contains('dark');
if(currentTheme=="dark"){
    document.body.classList.add('dark');
    const isDark = document.body.classList.contains('dark');
}
</script>   

  
</body>
</html>
