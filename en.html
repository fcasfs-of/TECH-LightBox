<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
 <link href='favicon.png' rel='icon' type='image/png'/>
<script src="https://lightbox.fcasfs-of.cloud-fs.net/app/api.js"></script>


  <title>Lightbox - Miscellaneous Content</title>
  
  <link media="all" rel="stylesheet" href="style/theme.css" />

  <style>

  </style>
  
</head>
<body>

<header class="lbxx">
  <div class="dname">
    <h1><span class="icon"></span>Lightbox - Miscellaneous Content</h1>
    <button id="theme-toggle">Dark Mode</button>
  </div>

  
<nav>
  <div class="cat-group">
    <h3>Visual Media</h3>
    <button id="btnImage">View Image</button>
    <button id="btnSVG">View SVG</button>
  </div>
  
  <div class="cat-group">
    <h3>Gallery</h3>
    <button id="btnSlideshow">View Slideshow</button>
    <button id="btnCarrossel">View Carousel</button>
  </div>
  
  <div class="cat-group">
    <h3>Text & Links</h3>
    <button id="btnText">View Text</button>
    <button id="btnLink">View Link</button>
  </div>
  
  <div class="cat-group">
    <h3>Data</h3>
    <button id="btnTable">View Table</button>
    <button id="btnList">View List</button>
  </div>

  <div class="cat-group">
    <h3>Multimedia</h3>
    <button id="btnPlaylist">View Playlist</button>
    <button id="btnAudio">View Audio</button>
    <button id="btnVideo">View Video</button>
  </div>
 
  <div class="cat-group">
    <h3>Interaction</h3>
    <button id="btnForm">View Form</button>
  </div>
  
  <div class="cat-group">
    <h3>Analytics</h3>
    <button id="btnGrafic">View Chart</button>
  </div>
  
  <div class="cat-group">
    <h3>Documents</h3>
    <button id="btnPDF">View PDF</button>
  </div>
  
  <div class="cat-group">
    <h3>Location</h3>
    <button id="btnMap">View Map</button>
  </div>

  <div class="cat-group">
    <h3>Business</h3>
    <button id="btnContact">View Contact</button>
    <button id="btnProduct">View Product</button>
  </div>
</nav>

  
  <div class="lbxx-footer-container">
    <button id="meuBotaoConfig">Open Options Panel</button>
  </div>
</header>

  
<div id="previ_box"></div>

<script src="core-b.js"></script>
<script src="core-e.js"></script>

<script>
</script>

</body>
</html>
