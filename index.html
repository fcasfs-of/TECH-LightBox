<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
 <link href='favicon.png' rel='icon' type='image/png'/>
<script src="https://lightbox.fcasfs-of.cloud-fs.net/app/api.js"></script>


  <title>Lightbox - Conteúdos Diversos</title>
  
  <link media="all" rel="stylesheet" href="style/theme.css" />

  <style>
    
  </style>
  
</head>
<body>

<header class="lbxx">
  <div class="dname">
    <h1><span class="icon"></span>Lightbox - Conteúdos Diversos</h1>
    <button id="theme-toggle">Modo Escuro</button>
  </div>
  

<nav class="nav-menu">
  <div class="cat-group">
    <h3>Mídia Visual</h3>
    <button id="btnImage">Visualizar Imagem</button>
    <button id="btnSVG">Visualizar SVG</button>
  </div>
  
  <div class="cat-group">
    <h3>Galeria</h3>
    <button id="btnSlideshow">Visualizar Slideshow</button>
    <button id="btnCarrossel">Visualizar Carrossel</button>
  </div>
  
  <div class="cat-group">
    <h3>Texto & Links</h3>
    <button id="btnText">Visualizar Texto</button>
    <button id="btnLink">Visualizar Link</button>
  </div>
  
  <div class="cat-group">
    <h3>Dados</h3>
    <button id="btnTable">Visualizar Tabela</button>
    <button id="btnList">Visualizar Lista</button>
  </div>

  <div class="cat-group">
    <h3>Multimídia</h3>
    <button id="btnPlaylist">Visualizar Playlist</button>
    <button id="btnAudio">Visualizar Áudio</button>
    <button id="btnVideo">Visualizar Vídeo</button>
  </div>
 
  <div class="cat-group">
    <h3>Interação</h3>
    <button id="btnForm">Visualizar Formulário</button>
  </div>
  
  <div class="cat-group">
    <h3>Análise</h3>
    <button id="btnGrafic">Visualizar Gráfico</button>
  </div>
  
  <div class="cat-group">
    <h3>Documentos</h3>
    <button id="btnPDF">Visualizar PDF</button>
  </div>
  
  <div class="cat-group">
    <h3>Localização</h3>
    <button id="btnMap">Visualizar Mapa</button>
  </div>

  <div class="cat-group">
    <h3>Negócios</h3>
    <button id="btnContact">Visualizar Contato</button>
    <button id="btnProduct">Visualizar Produto</button>
  </div>
</nav>


  <div class="lbxx-footer-container">
    <button id="meuBotaoConfig">Abrir Painel de Opções</button>
  </div>
</header>

  
<div id="previ_box"></div>


<script src="core-b.js"></script>
<script src="core-p.js"></script>

</script>

</html>
