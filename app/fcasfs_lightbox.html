orEach(b=>b.classList.remove('active'));document.querySelectorAll('.param-content').forEach(c=>c.classList.remove('active'));event.currentTarget.classList.add('active');document.getElementById('t-'+t).classList.add('active')};const p1=new URLSearchParams(window.location.search);let h=window.location.hash;if(h.startsWith('#'))h=h.substring(1);const p2=new URLSearchParams(h);let o1='',o2='',c1=0,c2=0;p1.forEach((v,k)=>{o1+=`<div class="param-item"><strong>${k}:</strong> <span>${v}</span></div>`;c1++});p2.forEach((v,k)=>{o2+=`<div class="param-item"><strong>${k}:</strong> <span>${v}</span></div>`;c2++});document.getElementById('qList').innerHTML=o1||'<div style="color:#718096;text-align:center;padding:12px 0;">No Query parameters found.</div>';document.getElementById('hList').innerHTML=o2||'<div style="color:#718096;text-align:center;padding:12px 0;">No Hash parameters found.</div>';document.getElementById('qB').textContent=c1;document.getElementById('hB').textContent=c2;document.getElementById('paramCount').textContent='Total: '+(c1+c2);</script></body></html>
