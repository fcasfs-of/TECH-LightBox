<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Access Denied</title></head><body><script>const s=document.createElement('style');s.textContent=':root{--primary-color:#dc3545;--text-color:#1d1d1f;--bg-color:#f5f5f7;--panel-bg:#ffffff;--border-color:#e2e8f0}*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-user-drag:none}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg-color);color:var(--text-color);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;width:100%}.container{text-align:center;width:100%}.container *{pointer-events:none}.icon-wrapper{margin-bottom:24px;width:100%}.icon-wrapper svg{width:80px;height:80px;fill:none;stroke:var(--primary-color);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}h1{font-size:clamp(4rem,10vw,6rem);font-weight:700;line-height:1;color:var(--primary-color);margin-bottom:16px;width:100%}h2{font-size:clamp(1.2rem,4vw,1.5rem);font-weight:600;margin-bottom:12px;color:var(--primary-color);width:100%}p{font-size:clamp(0.9rem,3vw,1rem);color:#000000;line-height:1.5;padding:0 10px;margin-bottom:24px;width:100%}.divider{border-top:1px solid var(--border-color);margin:32px 0 12px;width:100%}#paramPanel{display:block;background:var(--panel-bg);border:1px solid var(--border-color);border-radius:12px;padding:16px;margin:0 auto;text-align:left;width:100%;box-shadow:0 4px 12px rgba(0,0,0,.03);overflow:hidden;pointer-events:auto!important;user-select:auto!important}#paramPanel *{pointer-events:auto!important;user-select:auto!important}.param-header{display:flex;align-items:center;color:var(--primary-color);font-weight:600;font-size:14px;margin-bottom:16px;border-bottom:1px solid var(--border-color);padding-bottom:8px;width:100%}.param-header svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;margin-right:10px}.tabs{display:flex;gap:8px;margin-bottom:16px;width:100%}.tab{padding:8px 16px;font-size:13px;font-weight:600;background:#f8fafc;border:1px solid var(--border-color);border-radius:20px;cursor:pointer;color:#6e6e73;display:flex;align-items:center;gap:6px;transition:all .2s}.tab.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}.tab-badge{font-size:11px;background:rgba(0,0,0,0.06);padding:2px 6px;border-radius:10px;color:inherit}.tab.active .tab-badge{background:rgba(255,255,255,0.2)}.param-content{display:none;width:100%}.param-content.active{display:flex;flex-direction:column;gap:8px}.param-list{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;color:var(--text-color);display:flex;flex-direction:column;gap:8px;width:100%;max-height:240px;overflow-y:auto;overflow-x:hidden;padding-right:4px}.param-item{display:block;width:100%;background:#f8fafc;padding:10px 12px;border-radius:6px;border:1px solid #edf2f7;word-break:break-all;white-space:normal;box-sizing:border-box}.param-footer{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-color);text-align:center;width:100%}#paramCount{font-size:12px;background:#f8fafc;padding:4px 12px;border-radius:20px;border:1px solid var(--border-color);color:var(--text-color);display:inline-block}';document.head.appendChild(s);document.body.innerHTML='<div class="container"><div class="icon-wrapper"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div><h1>403</h1><h2>Access Denied</h2><p>You do not have permission to access this page. Please contact your administrator if you think this is a mistake.</p><div class="divider"></div><div id="paramPanel"><div class="param-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg><span>URL Request Parameters / Technical Details</span></div><div class="tabs"><div class="tab active" onclick="chT(\'query\')">Query <span class="tab-badge" id="qB">0</span></div><div class="tab" onclick="chT(\'hash\')">Hash <span class="tab-badge" id="hB">0</span></div></div><div class="param-content active" id="t-query"><div class="param-list" id="qList"></div></div><div class="param-content" id="t-hash"><div class="param-list" id="hList"></div></div><div class="param-footer"><span id="paramCount">Total: 0</span></div></div></div>';window.chT=function(t){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.param-content').forEach(c=>c.classList.remove('active'));event.currentTarget.classList.add('active');document.getElementById('t-'+t).classList.add('active')};const p1=new URLSearchParams(window.location.search);let h=window.location.hash;if(h.startsWith('#'))h=h.substring(1);const p2=new URLSearchParams(h);let o1='',o2='',c1=0,c2=0;p1.forEach((v,k)=>{o1+=`<div class="param-item"><strong>${k}:</strong> <span>${v}</span></div>`;c1++});p2.forEach((v,k)=>{o2+=`<div class="param-item"><strong>${k}:</strong> <span>${v}</span></div>`;c2++});document.getElementById('qList').innerHTML=o1||'<div style="color:#718096;text-align:center;padding:10px 0;">No Query parameters found.</div>';document.getElementById('hList').innerHTML=o2||'<div style="color:#718096;text-align:center;padding:10px 0;">No Hash parameters found.</div>';document.getElementById('qB').textContent=c1;document.getElementById('hB').textContent=c2;document.getElementById('paramCount').textContent='Total: '+(c1+c2);</script></body></html>
