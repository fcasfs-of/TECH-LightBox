<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightbox</title>
    <script src="https://lightbox.fcasfs-of.cloud-fs.net/app/core.js"></script>
    
 <link href='favicon.png' rel='icon' type='image/png'/>

    <link rel="stylesheet" href="doc/style.css">
<style>

</style>
</head>
<body>
    
    <header>
        <img src="favicon.png" style="width:64px;"/>
        <h1 id="header-title"></h1>
        <p id="header-subtitle"></p>
        <div id="demo-link-container"></div>
        <div>
            <span id="header-version"></span>
            <strong id="version-display"></strong>
        </div>
        <div id="player-version-box" style="display: none;">
            <span id="player-version-label"></span>
            <strong id="player-version-display"></strong>
        </div>
    </header>

    <main>
        <section id="doc-pt">
            <h2 id="title-pt"></h2>
            <p id="desc-pt"></p>
            <p id="init-pt"></p>
            <div id="base-params-pt"></div>
            <fieldset>
                <legend id="legend-global-pt"></legend>
                <div id="global-params-pt"></div>
            </fieldset>
            <fieldset>
                <legend id="legend-types-pt"></legend>
                <div id="types-params-pt"></div>
            </fieldset>
            <fieldset>
                <legend id="legend-context-pt"></legend>
                <div id="context-params-pt"></div>
            </fieldset>
            <fieldset>
                <legend id="legend-other-pt"></legend>
                <div id="other-params-pt"></div>
            </fieldset>
        </section>

        <section id="doc-en">
            <h2 id="title-en"></h2>
            <p id="desc-en"></p>
            <p id="init-en"></p>
            <div id="base-params-en"></div>
            <fieldset>
                <legend id="legend-global-en"></legend>
                <div id="global-params-en"></div>
            </fieldset>
            <fieldset>
                <legend id="legend-types-en"></legend>
                <div id="types-params-en"></div>
            </fieldset>
            <fieldset>
                <legend id="legend-context-en"></legend>
                <div id="context-params-en"></div>
            </fieldset>
            <fieldset>
                <legend id="legend-other-en"></legend>
                <div id="other-params-en"></div>
            </fieldset>
        </section>
    </main>
    
    <script src="docs_data.js"></script>

<script>  const userLang='pt';  </script>

    <script src="doc/dl.js"></script>
    <script src="doc/script.js"></script>
</body>
</html>
